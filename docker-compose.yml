services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: obsidian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: obsidian
      POSTGRES_PASSWORD: obsidian
      POSTGRES_DB: obsidian
    ports:
      - "5432:5432"
    volumes:
      - obsidian_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsidian -d obsidian"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: services/market-gateway/Dockerfile
    container_name: obsidian-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://obsidian:obsidian@postgres:5432/obsidian
      GATEWAY_PORT: "8080"
      SYMBOLS: ${SYMBOLS:-btcusdt,ethusdt,solusdt,bnbusdt,xrpusdt}
      TIMEFRAMES: ${TIMEFRAMES:-1m,5m,15m,1h,4h,1d}
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: obsidian-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://obsidian:obsidian@postgres:5432/obsidian
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-secret-change-me-please-32+chars}
      NEXT_PUBLIC_GATEWAY_WS_URL: ${NEXT_PUBLIC_GATEWAY_WS_URL:-ws://localhost:8080/stream}
    ports:
      - "3000:3000"

volumes:
  obsidian_pgdata:
